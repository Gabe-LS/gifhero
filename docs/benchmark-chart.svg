<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="680" height="310" rx="12" fill="#111827"/>
  <rect x="0.5" y="0.5" width="679" height="309" rx="12" fill="none" stroke="#1f2937"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#f3f4f6">gifhero vs the field</text>
  <text x="340" y="46" text-anchor="middle" font-size="10" fill="#6b7280">480p · 25 fixtures · default settings</text>

  <!-- Column headers -->
  <text x="210" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280" letter-spacing="0.05em">FILE SIZE</text>
  <text x="520" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280" letter-spacing="0.05em">QUALITY (VMAF)</text>

  <!-- Row 1: gifhero -->
  <text x="88" y="102" text-anchor="end" font-size="12" font-weight="600" fill="#e5e7eb">gifhero</text>
  <rect x="96" y="88" width="96" height="20" rx="3" fill="url(#g1)"/>
  <text x="198" y="102" font-size="11" fill="#a78bfa" font-weight="600">100%</text>

  <rect x="424" y="88" width="140" height="20" rx="3" fill="url(#g1)"/>
  <text x="570" y="102" font-size="11" fill="#a78bfa" font-weight="600">96.8</text>

  <!-- Row 2: gifski -->
  <text x="88" y="132" text-anchor="end" font-size="12" fill="#9ca3af">gifski</text>
  <rect x="96" y="118" width="100" height="20" rx="3" fill="url(#g2)"/>
  <text x="202" y="132" font-size="11" fill="#6b7280">104%</text>

  <rect x="424" y="118" width="105" height="20" rx="3" fill="url(#g2)"/>
  <text x="535" y="132" font-size="11" fill="#6b7280">96.1</text>

  <!-- Row 3: ffmpeg+gifsicle -->
  <text x="88" y="162" text-anchor="end" font-size="12" fill="#9ca3af">ffmpeg+gsc</text>
  <rect x="96" y="148" width="160" height="20" rx="3" fill="url(#g2)"/>
  <text x="262" y="162" font-size="11" fill="#6b7280">167%</text>

  <rect x="424" y="148" width="155" height="20" rx="3" fill="url(#g2)"/>
  <text x="585" y="162" font-size="11" fill="#6b7280">97.1</text>

  <!-- Row 4: ffmpeg -->
  <text x="88" y="192" text-anchor="end" font-size="12" fill="#9ca3af">ffmpeg</text>
  <rect x="96" y="178" width="181" height="20" rx="3" fill="url(#g2)"/>
  <text x="283" y="192" font-size="11" fill="#6b7280">189%</text>

  <rect x="424" y="178" width="180" height="20" rx="3" fill="url(#g2)"/>
  <text x="610" y="192" font-size="11" fill="#6b7280">97.6</text>

  <!-- Row 5: magick -->
  <text x="88" y="222" text-anchor="end" font-size="12" fill="#9ca3af">magick</text>
  <rect x="96" y="208" width="233" height="20" rx="3" fill="url(#g2)"/>
  <text x="335" y="222" font-size="11" fill="#6b7280">243%</text>

  <rect x="424" y="208" width="200" height="20" rx="3" fill="url(#g2)"/>
  <text x="630" y="222" font-size="11" fill="#6b7280">98.0</text>

  <!-- Divider -->
  <line x1="340" y1="80" x2="340" y2="236" stroke="#1f2937" stroke-width="1"/>

  <!-- Arrows -->
  <text x="96" y="248" font-size="9" fill="#4b5563">&#x25C4; smaller</text>
  <text x="400" y="248" font-size="9" fill="#4b5563">&#x25C4; worse</text>
  <text x="624" y="248" text-anchor="end" font-size="9" fill="#4b5563">better &#x25BA;</text>

  <!-- Bottom callout -->
  <rect x="160" y="264" width="360" height="34" rx="6" fill="#1f2937"/>
  <text x="340" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#a78bfa">Smallest files AND top-2 quality</text>
  <text x="340" y="293" text-anchor="middle" font-size="10" fill="#6b7280">4% smaller than gifski · +0.7 VMAF · zero lossy compression</text>
</svg>
