<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4c7cc"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="700" height="310" rx="12" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="699" height="309" rx="12" fill="none" stroke="#e5e7eb"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">In-browser encoding: gifhero vs gifski-wasm</text>
  <text x="350" y="46" text-anchor="middle" font-size="10" fill="#525252">480p · 25 fixtures · same WASM runtime · same input frames</text>

  <!-- Divider -->
  <line x1="350" y1="56" x2="350" y2="240" stroke="#e5e7eb" stroke-width="1"/>

  <!--
    LEFT:  File size. gifhero=100%, gifski-wasm=127% (21% larger). Max bar at 127%.
           Scale: 200/127 = 1.575px per %
    RIGHT: VMAF. gifhero=96.4, gifski-wasm=96.0 (avg across 25 fixtures).
           Range 93-100. Scale: 200/(100-93) = 28.6px per point.
  -->

  <!-- ==================== LEFT: FILE SIZE ==================== -->
  <text x="190" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#525252" letter-spacing="0.05em">FILE SIZE (% of gifhero)</text>

  <text x="108" y="110" text-anchor="end" font-size="12" font-weight="600" fill="#111827">gifhero</text>
  <rect x="115" y="97" width="158" height="20" rx="3" fill="url(#g1)"/>
  <text x="279" y="112" font-size="10" fill="#6d28d9" font-weight="600">100%</text>

  <text x="108" y="150" text-anchor="end" font-size="12" fill="#4b5563">gifski-wasm</text>
  <rect x="115" y="137" width="200" height="20" rx="3" fill="url(#g2)"/>
  <text x="321" y="152" font-size="10" fill="#525252">127%</text>

  <text x="115" y="185" font-size="10" fill="#5b21b6" font-weight="600">25/25 fixtures smaller</text>
  <text x="115" y="200" font-size="10" fill="#525252">avg 21% smaller</text>

  <text x="115" y="228" font-size="9" fill="#525252">&#x25C4; smaller is better</text>

  <!-- ==================== RIGHT: QUALITY ==================== -->
  <text x="525" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#525252" letter-spacing="0.05em">QUALITY (VMAF 0–100)</text>

  <text x="423" y="110" text-anchor="end" font-size="12" font-weight="600" fill="#111827">gifhero</text>
  <rect x="430" y="97" width="137" height="20" rx="3" fill="url(#g1)"/>
  <text x="573" y="112" font-size="10" fill="#6d28d9" font-weight="600">96.8</text>

  <text x="423" y="150" text-anchor="end" font-size="12" fill="#4b5563">gifski-wasm</text>
  <rect x="430" y="137" width="131" height="20" rx="3" fill="url(#g2)"/>
  <text x="567" y="152" font-size="10" fill="#525252">96.6</text>

  <text x="430" y="185" font-size="10" fill="#525252">13/25 fixtures higher VMAF</text>
  <text x="430" y="200" font-size="10" fill="#525252">comparable quality</text>

  <text x="630" y="228" text-anchor="end" font-size="9" fill="#525252">higher is better &#x25BA;</text>

  <!-- ==================== BOTTOM CALLOUT ==================== -->
  <line x1="40" y1="252" x2="660" y2="252" stroke="#e5e7eb" stroke-width="1"/>
  <text x="350" y="274" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">21% smaller on every fixture, same quality</text>
  <text x="350" y="290" text-anchor="middle" font-size="10" fill="#525252">Both run single-threaded WASM in the browser. Same input, same runtime.</text>
</svg>
