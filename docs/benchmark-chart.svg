<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4c7cc"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="700" height="310" rx="12" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="699" height="309" rx="12" fill="none" stroke="#e5e7eb"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">gifhero vs the field</text>
  <text x="350" y="46" text-anchor="middle" font-size="10" fill="#525252">480p · 25 fixtures · default settings</text>

  <!-- Divider -->
  <line x1="350" y1="56" x2="350" y2="240" stroke="#e5e7eb" stroke-width="1"/>

  <!--
    AAA contrast (7:1+) on #ffffff:
      #111827 → 17.74  (titles, gifhero labels)
      #525252 →  7.81  (secondary text, subtitles, axis hints)
      #4b5563 →  7.56  (other encoder labels)
      #6d28d9 →  7.10  (purple accent values)
      #5b21b6 →  8.98  (purple accent callout)

    Both charts: max bar = 200px (magick fills width)
    LEFT  size:  0.823px per %
    RIGHT VMAF:  50px per point above 94
  -->

  <!-- ==================== LEFT: FILE SIZE ==================== -->
  <text x="175" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#525252" letter-spacing="0.05em">FILE SIZE (% of gifhero)</text>

  <text x="73" y="102" text-anchor="end" font-size="11" font-weight="600" fill="#111827">gifhero</text>
  <rect x="80" y="89" width="82" height="18" rx="3" fill="url(#g1)"/>
  <text x="168" y="102" font-size="10" fill="#6d28d9" font-weight="600">100%</text>

  <text x="73" y="130" text-anchor="end" font-size="11" fill="#4b5563">gifski</text>
  <rect x="80" y="117" width="86" height="18" rx="3" fill="url(#g2)"/>
  <text x="172" y="130" font-size="10" fill="#525252">104%</text>

  <text x="73" y="158" text-anchor="end" font-size="11" fill="#4b5563">ffmpeg+gsc</text>
  <rect x="80" y="145" width="137" height="18" rx="3" fill="url(#g2)"/>
  <text x="223" y="158" font-size="10" fill="#525252">167%</text>

  <text x="73" y="186" text-anchor="end" font-size="11" fill="#4b5563">ffmpeg</text>
  <rect x="80" y="173" width="156" height="18" rx="3" fill="url(#g2)"/>
  <text x="242" y="186" font-size="10" fill="#525252">189%</text>

  <text x="73" y="214" text-anchor="end" font-size="11" fill="#4b5563">magick</text>
  <rect x="80" y="201" width="200" height="18" rx="3" fill="url(#g2)"/>
  <text x="286" y="214" font-size="10" fill="#525252">243%</text>

  <text x="80" y="236" font-size="9" fill="#525252">&#x25C4; smaller is better</text>

  <!-- ==================== RIGHT: QUALITY ==================== -->
  <text x="525" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#525252" letter-spacing="0.05em">QUALITY (VMAF 0–100)</text>

  <text x="423" y="102" text-anchor="end" font-size="11" font-weight="600" fill="#111827">gifhero</text>
  <rect x="430" y="89" width="140" height="18" rx="3" fill="url(#g1)"/>
  <text x="576" y="102" font-size="10" fill="#6d28d9" font-weight="600">96.8</text>

  <text x="423" y="130" text-anchor="end" font-size="11" fill="#4b5563">gifski</text>
  <rect x="430" y="117" width="105" height="18" rx="3" fill="url(#g2)"/>
  <text x="541" y="130" font-size="10" fill="#525252">96.1</text>

  <text x="423" y="158" text-anchor="end" font-size="11" fill="#4b5563">ffmpeg+gsc</text>
  <rect x="430" y="145" width="155" height="18" rx="3" fill="url(#g2)"/>
  <text x="591" y="158" font-size="10" fill="#525252">97.1</text>

  <text x="423" y="186" text-anchor="end" font-size="11" fill="#4b5563">ffmpeg</text>
  <rect x="430" y="173" width="180" height="18" rx="3" fill="url(#g2)"/>
  <text x="616" y="186" font-size="10" fill="#525252">97.6</text>

  <text x="423" y="214" text-anchor="end" font-size="11" fill="#4b5563">magick</text>
  <rect x="430" y="201" width="200" height="18" rx="3" fill="url(#g2)"/>
  <text x="636" y="214" font-size="10" fill="#525252">98.0</text>

  <text x="630" y="236" text-anchor="end" font-size="9" fill="#525252">higher is better &#x25BA;</text>

  <!-- ==================== BOTTOM CALLOUT ==================== -->
  <line x1="40" y1="252" x2="660" y2="252" stroke="#e5e7eb" stroke-width="1"/>
  <text x="350" y="274" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Smallest files AND top-2 quality</text>
  <text x="350" y="290" text-anchor="middle" font-size="10" fill="#525252">4% smaller than gifski · +0.7 VMAF · zero lossy compression</text>
</svg>
