<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gifhero demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fafafa; color: #111;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 64px 24px 48px;
  }

  h1 { font-size: 1.4rem; letter-spacing: -0.01em; }
  .subtitle { color: #666; font-size: 0.85rem; margin-top: 4px; }
  .subtitle a { color: #7c3aed; text-decoration: none; }

  .spec {
    margin-top: 24px; font-size: 0.8rem; color: #999;
    letter-spacing: 0.02em;
  }

  .drop-zone {
    margin-top: 12px; width: 100%; max-width: 480px;
    border: 2px dashed #d1d5db; border-radius: 12px;
    padding: 56px 24px; text-align: center;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.over { border-color: #7c3aed; background: #faf5ff; }
  .drop-zone p { color: #888; font-size: 0.9rem; }
  .drop-zone input { display: none; }

  .status {
    margin-top: 20px; font-size: 0.85rem; color: #666;
    min-height: 1.4em; text-align: center;
  }

  .result {
    margin-top: 20px; display: none; flex-direction: column;
    align-items: center; gap: 14px; max-width: 480px; width: 100%;
  }
  .result.visible { display: flex; }
  .result img {
    max-width: 100%; border-radius: 8px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .meta { font-size: 0.8rem; color: #888; }

  .download {
    display: inline-block; padding: 10px 28px;
    background: #7c3aed; color: #fff; border-radius: 8px;
    text-decoration: none; font-weight: 500; font-size: 0.85rem;
    transition: background 0.15s;
  }
  .download:hover { background: #6d28d9; }

  footer {
    margin-top: auto; padding-top: 48px;
    font-size: 0.75rem; color: #bbb; text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>gifhero</h1>
<p class="subtitle">Video to GIF, in your browser. <a href="https://github.com/Gabe-LS/gifhero">Source</a></p>

<p class="spec">360p &middot; 20 fps &middot; 10s max</p>

<div class="drop-zone" id="dropZone">
  <p>Drop a video or click to choose</p>
  <input type="file" id="fileInput" accept="video/*">
</div>

<p class="status" id="status"></p>

<div class="result" id="result">
  <img id="preview" alt="Generated GIF">
  <p class="meta" id="meta"></p>
  <a class="download" id="downloadLink" download="gifhero.gif">Download GIF</a>
</div>

<footer>
  Runs entirely client-side. Nothing is uploaded.<br>
  Page weight: 125 KB gzipped (WASM encoder included).
</footer>

<script type="module">
  import { gifhero } from "./gifhero.js";

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const preview = document.getElementById("preview");
  const meta = document.getElementById("meta");
  const downloadLink = document.getElementById("downloadLink");

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("over");
    if (e.dataTransfer.files[0]) encode(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) encode(fileInput.files[0]);
  });

  async function encode(file) {
    result.classList.remove("visible");
    status.textContent = "Decoding video...";

    const t0 = performance.now();

    try {
      const gif = await gifhero
        .fromFile(file)
        .fps(20)
        .width(360)
        .duration(10)
        .onProgress(p => {
          if (p.phase === "extracting") {
            status.textContent = "Decoding " + Math.round(p.progress * 100) + "%";
          } else {
            status.textContent = "Encoding...";
          }
        })
        .toGif();

      const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
      const sizeKB = (gif.byteLength / 1024).toFixed(0);
      const blob = new Blob([gif], { type: "image/gif" });
      const url = URL.createObjectURL(blob);

      preview.src = url;
      meta.textContent = sizeKB + " KB · " + elapsed + "s";
      downloadLink.href = url;
      result.classList.add("visible");
      status.textContent = "";
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  }
</script>

</body>
</html>
