<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gifhero Browser SDK Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; padding: 24px; background: #1a1a2e; color: #e0e0e0; }
    h1 { margin-bottom: 8px; font-size: 1.4rem; }
    h2 { margin: 24px 0 8px; font-size: 1.1rem; color: #7ecfff; }
    .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
    .panel { background: #16213e; border-radius: 8px; padding: 16px; min-width: 300px; }
    video, img { max-width: 480px; border-radius: 4px; background: #000; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; background: #0f3460; color: #e0e0e0; }
    button:hover { background: #1a5276; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .progress { margin-top: 8px; font-size: 0.85rem; color: #999; min-height: 1.2em; }
    .result { margin-top: 8px; }
    .result img { display: block; margin-top: 4px; }
    .meta { font-size: 0.8rem; color: #888; margin-top: 4px; }
    input[type="file"] { margin-bottom: 8px; }
    label { display: block; margin-bottom: 4px; font-size: 0.85rem; }
    select, input[type="number"] { padding: 4px 8px; border-radius: 4px; border: 1px solid #333; background: #0a0a1a; color: #e0e0e0; width: 80px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .compare { display: inline-flex; gap: 5px; }
    .compare-col { }
    .compare-col h3 { font-size: 0.95rem; margin-bottom: 4px; color: #ccc; }
    .compare-col img { display: block; }
    .winner { color: #4caf50; font-weight: bold; }
    .loser { color: #999; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>gifhero Browser SDK Test</h1>
  <p class="subtitle">Max 20s, 480px longest dimension. Uses VideoDecoder fast path.</p>

  <!-- Benchmark: gifhero vs gifski -->
  <h2>Video → GIF Benchmark</h2>
  <div class="panel">
    <input type="file" id="benchFile" accept="video/*">
    <div class="controls">
      <label>FPS <input type="number" id="benchFps" value="20" min="1" max="30"></label>
      <label>Preset
        <select id="benchPreset">
          <option value="balanced">balanced</option>
          <option value="quality">quality</option>
        </select>
      </label>
    </div>
    <button id="benchStart" disabled>Run Benchmark (gifhero → gifski)</button>
    <div class="progress" id="benchProgress"></div>
    <div class="compare" id="benchResults" style="margin-top: 12px;"></div>
  </div>

  <!-- Quick tests -->
  <h2>Quick Tests</h2>
  <div class="row">
    <div class="panel">
      <h3 style="color: #7ecfff; font-size: 0.95rem; margin-bottom: 8px;">Canvas Drawing → GIF</h3>
      <canvas id="drawCanvas" width="320" height="180" style="border: 1px solid #333; cursor: crosshair;"></canvas>
      <div class="controls" style="margin-top: 8px;">
        <button id="canvasRecord">Record 3s</button>
        <button id="canvasClear">Clear</button>
      </div>
      <div class="progress" id="canvasProgress"></div>
      <div class="result" id="canvasResult"></div>
    </div>
    <div class="panel">
      <h3 style="color: #7ecfff; font-size: 0.95rem; margin-bottom: 8px;">Webcam → GIF</h3>
      <div class="controls">
        <button id="webcamStart">Start Webcam</button>
        <button id="webcamCapture" disabled>Capture 3s</button>
      </div>
      <video id="webcamPreview" autoplay muted playsinline style="max-height: 160px; margin-top: 8px;"></video>
      <div class="progress" id="webcamProgress"></div>
      <div class="result" id="webcamResult"></div>
    </div>
  </div>

  <script type="module">
    import { gifhero } from "../../dist/browser.js";

    const MAX_DURATION = 20;
    const MAX_DIMENSION = 480;

    function showResult(containerId, gif, elapsed) {
      const container = document.getElementById(containerId);
      const blob = new Blob([gif.buffer], { type: "image/gif" });
      const url = URL.createObjectURL(blob);
      const sizeKB = (gif.byteLength / 1024).toFixed(0);
      container.innerHTML = `
        <img src="${url}" alt="GIF result">
        <div class="meta">${sizeKB} KB · ${elapsed.toFixed(1)}s</div>
        <a href="${url}" download="gifhero-output.gif" style="color: #7ecfff; font-size: 0.8rem;">Download</a>
      `;
    }

    function showCompare(containerId, label, gif, elapsed, isWinner) {
      const sizeKB = (gif.byteLength / 1024).toFixed(0);
      const blob = new Blob([gif.buffer], { type: "image/gif" });
      const url = URL.createObjectURL(blob);
      const cls = isWinner ? 'winner' : 'loser';
      return `
        <div class="compare-col">
          <h3>${label} <span class="${cls}">${sizeKB} KB · ${elapsed.toFixed(1)}s</span></h3>
          <img src="${url}" alt="${label}">
          <div class="meta"><a href="${url}" download="${label.toLowerCase()}.gif" style="color: #7ecfff;">Download</a></div>
        </div>
      `;
    }

    // ── Benchmark: gifhero vs gifski ──
    const benchFile = document.getElementById("benchFile");
    const benchStart = document.getElementById("benchStart");

    benchFile.addEventListener("change", () => {
      if (benchFile.files[0]) benchStart.disabled = false;
    });

    benchStart.addEventListener("click", async () => {
      benchStart.disabled = true;
      const progress = document.getElementById("benchProgress");
      const results = document.getElementById("benchResults");
      results.innerHTML = "";

      const file = benchFile.files[0];
      const fps = parseInt(document.getElementById("benchFps").value) || 20;
      const preset = document.getElementById("benchPreset").value;

      console.log("━━━ BENCHMARK START ━━━");

      try {
        // Read file once, share the buffer
        const videoBuffer = await file.arrayBuffer();
        console.log(`[benchmark] File: ${(videoBuffer.byteLength / 1024 / 1024).toFixed(1)} MB, ${fps}fps, max ${MAX_DURATION}s, target ${MAX_DIMENSION}px`);

        // ── gifhero: full pipeline in video worker ──
        progress.textContent = "gifhero: decoding + encoding...";
        const t1 = performance.now();
        const gifheroGif = await gifhero
          .fromFile(file)
          .fps(fps)
          .width(MAX_DIMENSION)
          .duration(MAX_DURATION)
          .preset(preset)
          .onProgress(p => {
            if (p.phase === "extracting") progress.textContent = `gifhero: decoding ${(p.progress * 100).toFixed(0)}%`;
            else progress.textContent = "gifhero: encoding...";
          })
          .toGif();
        const gifheroTime = (performance.now() - t1) / 1000;
        console.log(`[benchmark] gifhero: ${(gifheroGif.byteLength/1024).toFixed(0)} KB in ${gifheroTime.toFixed(1)}s`);

        // ── gifski-wasm: same VideoDecoder pipeline in its own worker ──
        progress.textContent = "gifski-wasm: decoding + encoding...";
        const gifskiWorker = new Worker("./dist/gifski-video-worker.js", { type: "module" });
        const wasmUrl = new URL("./dist/gifski_wasm_bg.wasm", location.href).href;
        const videoBufferCopy = videoBuffer.slice(0);

        const t2 = performance.now();
        const gifskiResult = await new Promise((resolve, reject) => {
          gifskiWorker.onmessage = (e) => {
            if (e.data.type === "progress") {
              if (e.data.phase === "extracting") progress.textContent = `gifski-wasm: decoding ${(e.data.progress * 100).toFixed(0)}%`;
              else progress.textContent = "gifski-wasm: encoding...";
            } else if (e.data.type === "result") resolve(e.data);
            else if (e.data.type === "error") reject(new Error(e.data.message));
          };
          gifskiWorker.onerror = (e) => reject(new Error(e.message));
          gifskiWorker.postMessage(
            { type: "encode", id: 0, videoBuffer: videoBufferCopy, fps, targetWidth: MAX_DIMENSION, quality: 90, maxDuration: MAX_DURATION, wasmUrl },
            [videoBufferCopy],
          );
        });
        gifskiWorker.terminate();
        const gifskiGif = new Uint8Array(gifskiResult.gif);
        const gifskiTime = (performance.now() - t2) / 1000;
        const gifskiEncodeTime = (gifskiResult.encodeTime / 1000).toFixed(1);
        console.log(`[benchmark] gifski-wasm: ${(gifskiGif.byteLength/1024).toFixed(0)} KB in ${gifskiTime.toFixed(1)}s (encode only: ${gifskiEncodeTime}s)`);

        // ── gifhero CLI (native Rayon) ──
        progress.textContent = "gifhero CLI (native Rayon): encoding on server...";
        let gifheroCliFormData = new FormData();
        gifheroCliFormData.append("video", file);
        gifheroCliFormData.append("fps", String(fps));
        gifheroCliFormData.append("width", String(MAX_DIMENSION));
        gifheroCliFormData.append("preset", preset);

        const t3 = performance.now();
        let gifheroCliGif = null;
        let gifheroCliTime = 0;
        try {
          const resp = await fetch("/api/gifhero", { method: "POST", body: gifheroCliFormData });
          if (!resp.ok) throw new Error(await resp.text());
          const buf = await resp.arrayBuffer();
          gifheroCliGif = new Uint8Array(buf);
          gifheroCliTime = (performance.now() - t3) / 1000;
          console.log(`[benchmark] gifhero CLI: ${(gifheroCliGif.byteLength/1024).toFixed(0)} KB in ${gifheroCliTime.toFixed(1)}s (native Rayon)`);
        } catch (err) {
          console.warn(`[benchmark] gifhero CLI failed: ${err.message}`);
        }

        // ── gifski CLI (native multi-threaded) ──
        progress.textContent = "gifski CLI (native multi-threaded): encoding on server...";
        const gifskiFormData = new FormData();
        gifskiFormData.append("video", file);
        gifskiFormData.append("fps", String(fps));
        gifskiFormData.append("width", String(MAX_DIMENSION));

        const t4 = performance.now();
        let gifskiCliGif = null;
        let gifskiCliTime = 0;
        try {
          const resp = await fetch("/api/gifski", { method: "POST", body: gifskiFormData });
          if (!resp.ok) throw new Error(await resp.text());
          const buf = await resp.arrayBuffer();
          gifskiCliGif = new Uint8Array(buf);
          gifskiCliTime = (performance.now() - t4) / 1000;
          console.log(`[benchmark] gifski CLI: ${(gifskiCliGif.byteLength/1024).toFixed(0)} KB in ${gifskiCliTime.toFixed(1)}s (native MT)`);
        } catch (err) {
          console.warn(`[benchmark] gifski CLI failed: ${err.message}`);
        }

        // ── Summary ──
        console.log(`[benchmark] SUMMARY @ ${fps}fps, ${MAX_DIMENSION}px:`);
        console.log(`[benchmark]   gifhero browser:     ${(gifheroGif.byteLength/1024).toFixed(0)} KB in ${gifheroTime.toFixed(1)}s`);
        if (gifheroCliGif) console.log(`[benchmark]   gifhero CLI (Rayon):  ${(gifheroCliGif.byteLength/1024).toFixed(0)} KB in ${gifheroCliTime.toFixed(1)}s`);
        console.log(`[benchmark]   gifski wasm:         ${(gifskiGif.byteLength/1024).toFixed(0)} KB in ${gifskiTime.toFixed(1)}s`);
        if (gifskiCliGif) console.log(`[benchmark]   gifski CLI (native):  ${(gifskiCliGif.byteLength/1024).toFixed(0)} KB in ${gifskiCliTime.toFixed(1)}s`);
        console.log("━━━ BENCHMARK END ━━━");

        progress.textContent = "";
        const entries = [
          { label: "gifhero browser", gif: gifheroGif, time: gifheroTime },
        ];
        if (gifheroCliGif) entries.push({ label: "gifhero CLI", gif: gifheroCliGif, time: gifheroCliTime });
        entries.push({ label: "gifski wasm", gif: gifskiGif, time: gifskiTime });
        if (gifskiCliGif) entries.push({ label: "gifski CLI", gif: gifskiCliGif, time: gifskiCliTime });
        const smallest = Math.min(...entries.map(e => e.gif.byteLength));
        results.innerHTML = entries.map(e =>
          showCompare("benchResults",
            `${e.label} — ${(e.gif.byteLength/1024).toFixed(0)} KB · ${e.time.toFixed(1)}s`,
            e.gif, e.time, e.gif.byteLength <= smallest)
        ).join("");

      } catch (err) {
        progress.textContent = `Error: ${err.message}`;
        console.error("[benchmark] error:", err);
        console.log("━━━ BENCHMARK END ━━━");
      }

      benchStart.disabled = false;
    });

    // ── Canvas drawing ──
    const drawCanvas = document.getElementById("drawCanvas");
    const drawCtx = drawCanvas.getContext("2d");
    drawCtx.fillStyle = "#1a1a2e";
    drawCtx.fillRect(0, 0, 320, 180);
    drawCtx.strokeStyle = "#7ecfff";
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = "round";

    let drawing = false;
    drawCanvas.addEventListener("mousedown", (e) => { drawing = true; drawCtx.beginPath(); drawCtx.moveTo(e.offsetX, e.offsetY); });
    drawCanvas.addEventListener("mousemove", (e) => { if (drawing) { drawCtx.lineTo(e.offsetX, e.offsetY); drawCtx.stroke(); } });
    drawCanvas.addEventListener("mouseup", () => drawing = false);
    drawCanvas.addEventListener("mouseleave", () => drawing = false);

    document.getElementById("canvasClear").addEventListener("click", () => {
      drawCtx.fillStyle = "#1a1a2e";
      drawCtx.fillRect(0, 0, 320, 180);
    });

    document.getElementById("canvasRecord").addEventListener("click", async () => {
      const btn = document.getElementById("canvasRecord");
      btn.disabled = true;
      const progress = document.getElementById("canvasProgress");
      progress.textContent = "Recording... draw something!";
      const t0 = performance.now();

      try {
        const gif = await gifhero
          .fromCanvas(drawCanvas, { frameCount: 30 })
          .fps(10)
          .onProgress(p => {
            if (p.phase === "extracting") progress.textContent = `Recording: ${p.framesExtracted}/${p.totalFrames}`;
            else progress.textContent = "Encoding...";
          })
          .toGif();

        const elapsed = (performance.now() - t0) / 1000;
        progress.textContent = `Done in ${elapsed.toFixed(1)}s`;
        showResult("canvasResult", gif, elapsed);
      } catch (err) {
        progress.textContent = `Error: ${err.message}`;
      }
      btn.disabled = false;
    });

    // ── Webcam ──
    let webcamStream = null;

    document.getElementById("webcamStart").addEventListener("click", async () => {
      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
        document.getElementById("webcamPreview").srcObject = webcamStream;
        document.getElementById("webcamCapture").disabled = false;
      } catch (err) {
        document.getElementById("webcamProgress").textContent = `Webcam error: ${err.message}`;
      }
    });

    document.getElementById("webcamCapture").addEventListener("click", async () => {
      if (!webcamStream) return;
      const btn = document.getElementById("webcamCapture");
      btn.disabled = true;
      const progress = document.getElementById("webcamProgress");
      const t0 = performance.now();

      try {
        const gif = await gifhero
          .fromStream(webcamStream)
          .fps(10)
          .duration(3)
          .width(240)
          .onProgress(p => {
            if (p.phase === "extracting") progress.textContent = `Capturing: ${p.framesExtracted} frames`;
            else progress.textContent = "Encoding...";
          })
          .toGif();

        const elapsed = (performance.now() - t0) / 1000;
        progress.textContent = `Done in ${elapsed.toFixed(1)}s`;
        showResult("webcamResult", gif, elapsed);
      } catch (err) {
        progress.textContent = `Error: ${err.message}`;
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
